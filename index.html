<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MG Code Accounts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      font-family: Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .lang-toggle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 20px;
      transition: background 0.2s;
    }

    .lang-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .logo-container {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 15px;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .server-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .server-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 25px;
      text-align: center;
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s, opacity 0.2s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .btn i {
      font-size: 18px;
    }

    .email-btn { background-color: #ea4335; }
    .discord-btn { background-color: #5865F2; }
    .youtube-btn { background-color: #FF0000; }
    .tiktok-btn { background-color: #111111; border: 1px solid #333; }
    .x-btn { background-color: #0f1419; border: 1px solid #333; }
    .reddit-btn { background-color: #FF4500; }
  </style>
</head>
<body>

  <div class="profile-card">
    <button class="lang-toggle" onclick="toggleLanguage()">English</button>

    <div class="logo-container">
      <img src="15.png" alt="Logo">
    </div>

    <div class="server-name" data-ar="—  𝗠𝗚 𝗖𝗼𝗗𝗲 || ³ ©" data-en="—  𝗠𝗚 𝗖𝗼𝗗𝗲 || ³ ©">—  𝗠𝗚 𝗖𝗼𝗗𝗲 || ³ ©</div>

    <div class="server-subtitle" data-ar="أهلاً بك في متصفح حسابات MG CoDe" data-en="Welcome to the MG Code Accounts Browser">أهلاً بك في متصفح حسابات MG CoDe</div>

    <div class="buttons-container">
      <a href="mailto:mg7app@gmail.com" class="btn email-btn">
        <i class="fa-solid fa-envelope"></i> <span data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</span>
      </a>

      <a href="https://discord.gg/7bRycGtMxn" class="btn discord-btn" target="_blank">
        <i class="fa-brands fa-discord"></i> <span data-ar="ديسكورد" data-en="Discord">ديسكورد</span>
      </a>

      <a href="https://youtube.com/@mgcode-7?si=xS2yIvUSOR8mjvZk" class="btn youtube-btn" target="_blank">
        <i class="fa-brands fa-youtube"></i> <span data-ar="يوتيوب" data-en="YouTube">يوتيوب</span>
      </a>

      <a href="https://www.tiktok.com/@mg7codee" class="btn tiktok-btn" target="_blank">
        <i class="fa-brands fa-tiktok"></i> <span data-ar="تيك توك" data-en="TikTok">تيك توك</span>
      </a>

      <a href="https://x.com/mg7code?s=11" class="btn x-btn" target="_blank">
        <i class="fa-brands fa-x-twitter"></i> <span data-ar="إكس (تويتر)" data-en="X (Twitter)">إكس (تويتر)</span>
      </a>

      <a href="https://www.reddit.com/user/mg7code/?utm_source=share&utm_medium=web3x&utm_name=web3xcss&utm_term=1&utm_content=share_button" class="btn reddit-btn" target="_blank">
        <i class="fa-brands fa-reddit"></i> <span data-ar="ريديت" data-en="Reddit">ريديت</span>
      </a>
    </div>
    
  </div>

  <script>
    function toggleLanguage() {
      const html = document.getElementById('html-root');
      const langBtn = document.querySelector('.lang-toggle');
      const elements = document.querySelectorAll('[data-ar]');

      if (html.getAttribute('lang') === 'ar') {
        html.setAttribute('lang', 'en');
        html.setAttribute('dir', 'ltr');
        langBtn.textContent = 'العربية';
        elements.forEach(el => el.textContent = el.getAttribute('data-en'));
      } else {
        html.setAttribute('lang', 'ar');
        html.setAttribute('dir', 'rtl');
        langBtn.textContent = 'English';
        elements.forEach(el => el.textContent = el.getAttribute('data-ar'));
      }
    }
  </script>

</body>
</html>
